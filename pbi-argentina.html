<title>PBI de Argentina · evolución por gobierno y por sector</title>

<style>
:root{

}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#12141a; --card:#171a22; --ink:#eef0f4; --ink2:#a6adbd; --ink3:#6f7686;
    --line:#262a34; --line2:#333846;
    --pib:#8fa9e6; --pibsoft:#8fa9e622; --marker:#e5776b;
    --shadow:0 1px 0 #ffffff08 inset, 0 10px 34px -18px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#12141a; --card:#171a22; --ink:#eef0f4; --ink2:#a6adbd; --ink3:#6f7686;
  --line:#262a34; --line2:#333846; --pib:#8fa9e6; --pibsoft:#8fa9e622; --marker:#e5776b;
  --shadow:0 1px 0 #ffffff08 inset, 0 10px 34px -18px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);
  font-family:'Archivo',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  font-feature-settings:'tnum' 1,'cv11' 1; -webkit-font-smoothing:antialiased;}
.wrap{max-width:1060px;margin:0 auto;padding:26px 20px 40px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:6px}
h1{font-size:clamp(23px,3.4vw,33px);line-height:1.02;letter-spacing:-.02em;font-weight:800;margin:0}
h1 .sub{display:block;font-weight:500;font-size:clamp(13px,1.7vw,15px);letter-spacing:0;color:var(--ink2);margin-top:7px;max-width:60ch}
.src{font-size:12px;color:var(--ink3);text-align:right;line-height:1.5}
.tabs{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:4px;gap:3px;margin:20px 0 4px;box-shadow:var(--shadow)}
.tab{appearance:none;border:0;background:transparent;color:var(--ink2);font:inherit;font-weight:600;font-size:14px;
  padding:8px 16px;border-radius:8px;cursor:pointer;transition:background .15s,color .15s}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.tab:focus-visible{outline:2px solid var(--pib);outline-offset:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 18px 8px;box-shadow:var(--shadow)}
.reading{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 26px;padding:4px 4px 16px}
.reading .big{font-size:clamp(30px,5.2vw,46px);font-weight:800;letter-spacing:-.03em;line-height:1}
.reading .unit{font-size:14px;color:var(--ink2);font-weight:500}
.reading .chip{font-size:13.5px;font-weight:600;padding:5px 11px;border-radius:999px;line-height:1}
.up{color:#1f7a4d;background:#1f7a4d18}.down{color:#c0392b;background:#c0392b18}
.reading .meta{font-size:13px;color:var(--ink2);font-weight:500}
.chartbox{position:relative}
svg.chart{display:block;width:100%;height:auto;overflow:visible;touch-action:none}
.tip{position:absolute;pointer-events:none;z-index:6;background:var(--ink);color:var(--paper);
  padding:9px 11px;border-radius:9px;font-size:12.5px;line-height:1.45;transform:translate(-50%,-116%);
  white-space:nowrap;opacity:0;transition:opacity .1s;box-shadow:0 10px 24px -12px rgba(0,0,0,.5)}
.tip b{font-weight:700}.tip .tk{color:var(--paper);opacity:.62;font-weight:500}
.tip .g.up{color:#7ee0a6;background:none;padding:0}.tip .g.down{color:#ff9b8f;background:none;padding:0}
.legend{display:flex;flex-wrap:wrap;gap:7px;padding:12px 4px 6px}
.era{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);
  padding:6px 11px 6px 8px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer;
  transition:border-color .15s, color .15s, background .15s}
.era .dot{width:11px;height:11px;border-radius:3px;flex:none}
.era .yr{color:var(--ink3);font-weight:500}
.era[data-on="false"]{opacity:.42}
.era:hover{color:var(--ink)}
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:6px 4px 2px;border-top:1px solid var(--line);margin-top:4px}
.seg{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{appearance:none;border:0;background:transparent;color:var(--ink2);font:inherit;font-weight:600;font-size:12.5px;padding:6px 12px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.mini{font-size:12.5px;color:var(--ink3);font-weight:600}
.mini a{color:var(--ink2);cursor:pointer;text-decoration:none;border-bottom:1px dashed var(--line2);margin-left:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:12px 4px 8px}
.chip-s{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);
  padding:5px 10px;border-radius:999px;font-size:12px;font-weight:600;color:var(--ink);cursor:pointer;user-select:none;
  transition:opacity .12s,border-color .12s}
.chip-s .sw{width:10px;height:10px;border-radius:50%;flex:none}
.chip-s[data-on="false"]{opacity:.34}
.chip-s .ia{color:var(--ink3);font-weight:600;font-size:11px}
.foot{color:var(--ink3);font-size:11.5px;line-height:1.6;padding:16px 4px 0;max-width:92ch}
.hidden{display:none!important}
@media (max-width:620px){ .reading .big{font-size:34px} .src{text-align:left} }
</style>
</head>

  function yScale(min,max){const y=v=>M.t+PH-((v-min)/(max-min))*PH;y.min=min;y.max=max;return y;}
  function niceTicks(min,max,n){const span=max-min,raw=span/n,mag=Math.pow(10,Math.floor(Math.log10(raw)));

  function drawBands(y){
    const g=el('g',{});

  }
  function hoverPIB(i,p){
    hoverIdx=i; const y=curY; const gx=document.getElementById('hover'); if(!gx)return;
    while(gx.firstChild)gx.removeChild(gx.firstChild);
    const X=xFrac(i),Y=y(PIB[i]);
    gx.appendChild(el('line',{x1:X,y1:M.t,x2:X,y2:M.t+PH,stroke:'var(--ink2)','stroke-opacity':.35,'stroke-width':1}));
    gx.appendChild(el('circle',{cx:X,cy:Y,r:4,fill:'var(--pib)',stroke:'var(--card)','stroke-width':2}));
    let ia=''; if(i>=4){const g=(PIB[i]/PIB[i-4]-1)*100; const cl=g>=0?'up':'down';
      ia='<span class="g '+cl+'">'+(g>=0?'+':'')+g.toLocaleString('es-AR',{minimumFractionDigits:1,maximumFractionDigits:1})+'% i.a.</span>';}
    showTip(X,Y,'<span class="tk">'+T[i].replace('T',' · T')+'</span><br><b>'+fmt(PIB[i])+'</b> mil mill. $ 2004<br>'+ia);
  }
  function hoverSec(i,p){
    const src=secMode==='index'?SI:SL; let y=curY;
    const vis=visSectors(); if(!vis.length){onLeave();return;}
    let best=null,bd=1e9;
    vis.forEach(s=>{const v=src[s][i];if(v==null)return;const d=Math.abs(y(v)-p.y);if(d<bd){bd=d;best=s;}});
    if(best!==hoverSector){hoverSector=best;render();y=curY;}
    const gx=document.getElementById('hover'); if(!gx)return;
    while(gx.firstChild)gx.removeChild(gx.firstChild);
    const X=xFrac(i);
    gx.appendChild(el('line',{x1:X,y1:M.t,x2:X,y2:M.t+PH,stroke:'var(--ink2)','stroke-opacity':.3,'stroke-width':1}));
    if(best){const v=src[best][i],Y=y(v);
      gx.appendChild(el('circle',{cx:X,cy:Y,r:4,fill:secColor[best],stroke:'var(--card)','stroke-width':2}));
      let ia=''; if(i>=4&&src[best][i-4]!=null){const g=(SL[best][i]/SL[best][i-4]-1)*100,cl=g>=0?'up':'down';
        ia='<br><span class="g '+cl+'">'+(g>=0?'+':'')+g.toLocaleString('es-AR',{minimumFractionDigits:1,maximumFractionDigits:1})+'% i.a.</span>';}
      const val=secMode==='index'?(fmt(v)+' <span class=tk>(2004=100)</span>'):(fmt(v)+' mil mill. $');
      showTip(X,Y,'<b>'+best.replace(/^[A-P]\. /,'')+'</b><br><span class="tk">'+T[i].replace('T',' · T')+'</span> · '+val+ia);
    }
  }
  function showTip(X,Y,html){
    const r=svg.getBoundingClientRect();
    tip.innerHTML=html;
    tip.style.left=(X/VW*r.width)+'px';
    tip.style.top=(Y/VH*r.height)+'px';
    tip.style.opacity=1;
  }
  function onLeave(){tip.style.opacity=0;hoverIdx=-1;if(tab==='sec'&&hoverSector){hoverSector=null;render();}
    const gx=document.getElementById('hover');if(gx)while(gx.firstChild)gx.removeChild(gx.firstChild);}

  let curY;
  const _renderPIB=renderPIB, _renderSec=renderSectors;
  renderPIB=function(){const vals=PIB,min=Math.min(...vals),max=Math.max(...vals);
    curY=yScale(Math.floor((min-20)/20)*20,Math.ceil((max+15)/20)*20);_renderPIB();};
  renderSectors=function(){const src=secMode==='index'?SI:SL,vis=visSectors();let mn=Infinity,mx=-Infinity;
    vis.forEach(s=>src[s].forEach(v=>{if(v!=null){if(v<mn)mn=v;if(v>mx)mx=v;}}));if(!isFinite(mn)){mn=0;mx=100;}
    const pad=(mx-mn)*0.06||10;
    curY=yScale(secMode==='index'?Math.max(0,Math.floor((mn-pad)/10)*10):Math.floor((mn-pad)/10)*10,Math.ceil((mx+pad)/10)*10);
    _renderSec();};

  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- reading / legend / chips ----------
  function setReadingPIB(){
    document.getElementById('reading').classList.remove('hidden');
    const li=N-1, v=PIB[li], g=(PIB[li]/PIB[li-4]-1)*100;
    document.getElementById('r-big').textContent=fmt(v);
    document.getElementById('r-unit').textContent='mil mill. de $ a precios de 2004';
    const chip=document.getElementById('r-chip');
    chip.textContent=(g>=0?'+':'')+g.toLocaleString('es-AR',{minimumFractionDigits:1,maximumFractionDigits:1})+'% i.a.';
    chip.className='chip '+(g>=0?'up':'down');
    document.getElementById('r-meta').textContent='2.º trimestre de 2026 · −0,6% s/ trim. anterior (desest.)';
  }
  function buildEraLegend(){
    const box=document.getElementById('era-legend'); box.innerHTML='';
    ERAS.forEach(e=>{
      const b=document.createElement('button'); b.className='era'; b.dataset.on='true';
      b.innerHTML='<span class="dot" style="background:'+e.c+'"></span>'+e.name+
        ' <span class="yr">’'+e.a.slice(2,4)+'–’'+(e.id==='milei'?'26':e.b.slice(2,4))+'</span>';
      b.onclick=()=>{eraOn[e.id]=!eraOn[e.id];b.dataset.on=eraOn[e.id];render();};
      box.appendChild(b);
    });
  }
  function buildChips(){
    const box=document.getElementById('sec-chips'); box.innerHTML='';
    SECTORS.forEach(s=>{
      const b=document.createElement('button'); b.className='chip-s'; b.dataset.on='true';
      const nm=s.replace(/^[A-P]\. /,''); const ia=SIA[s];
      b.innerHTML='<span class="sw" style="background:'+secColor[s]+'"></span>'+nm+
        ' <span class="ia">'+(ia>=0?'+':'')+ia.toLocaleString('es-AR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%</span>';
      b.title=s;
      b.onmouseenter=()=>{if(secOn[s]){hoverSector=s;render();}};
      b.onmouseleave=()=>{if(hoverSector===s){hoverSector=null;render();}};
      b.onclick=()=>{secOn[s]=!secOn[s];b.dataset.on=secOn[s];if(!secOn[s]&&hoverSector===s)hoverSector=null;render();};
      box.appendChild(b);
    });
  }

  // ---------- tabs ----------
  const tPib=document.getElementById('tab-pib'), tSec=document.getElementById('tab-sec');
  function selectTab(which){
    tab=which; mounted=false;
    tPib.setAttribute('aria-selected',which==='pib'); tSec.setAttribute('aria-selected',which==='sec');
    document.getElementById('reading').classList.toggle('hidden',which!=='pib');
    document.getElementById('sec-controls').classList.toggle('hidden',which!=='pib'?false:true);
    document.getElementById('sec-chips').classList.toggle('hidden',which!=='sec');
    document.getElementById('foot').innerHTML=which==='pib'?FOOT_PIB:FOOT_SEC;
    hoverSector=null; onLeave(); render(); mounted=true;
  }
  tPib.onclick=()=>selectTab('pib'); tSec.onclick=()=>selectTab('sec');

  // sector mode + toggles
  const mIndex=document.getElementById('m-index'), mLevel=document.getElementById('m-level');
  mIndex.onclick=()=>{secMode='index';mIndex.setAttribute('aria-pressed','true');mLevel.setAttribute('aria-pressed','false');render();};
  mLevel.onclick=()=>{secMode='level';mLevel.setAttribute('aria-pressed','true');mIndex.setAttribute('aria-pressed','false');render();};
  document.getElementById('all-on').onclick=()=>{SECTORS.forEach(s=>secOn[s]=true);buildChips();render();};
  document.getElementById('all-off').onclick=()=>{SECTORS.forEach(s=>secOn[s]=false);buildChips();render();};

  svg.addEventListener('mousemove',onMove);
  svg.addEventListener('mouseleave',onLeave);
  svg.addEventListener('touchstart',onMove,{passive:true});
  svg.addEventListener('touchmove',onMove,{passive:true});
  window.addEventListener('resize',()=>{if(hoverIdx>=0)onLeave();});

  const FOOT_PIB='Serie del PBI en volumen (precios constantes de 2004). Niveles 2004–2018 según Cuentas Nacionales base 2004 (INDEC / Sec. de Política Económica); 2019–2024 encadenados con las variaciones interanuales oficiales del INDEC; 1.º de 2025 al 2.º de 2026 con los valores del último informe (2.º trim. 2026). Los cambios de gobierno ocurren el 10 de diciembre; las bandas se dibujan por año calendario. Fuente primaria: INDEC, Dirección Nacional de Cuentas Nacionales.';
  const FOOT_SEC='Valor Agregado Bruto a precios básicos por rama de actividad, en volumen (precios de 2004), 2004–2026 por trimestre (INDEC, Cuadro 3 del informe). «Índice 2004=100» toma el 1.er trimestre de 2004 como base de cada rama. El % junto a cada rama es la variación interanual del 2.º trim. 2026. Serie 2004–2023 definitiva; 2024–2026 preliminar. Fuente: INDEC, Dirección Nacional de Cuentas Nacionales.';

  // init
  setReadingPIB(); buildEraLegend(); buildChips();
  selectTab('pib');
})();
</script>
</body>
</html>
