  if(range==='1m') t.setMonth(t.getMonth()-1);
  if(range==='1w') t.setDate(t.getDate()-7);
  // base = última rueda en o antes de la fecha de corte
  let i=0; for(let k=0;k<DATA.length;k++){ if(DATA[k].d<=t) i=k; }
  return DATA.slice(i);
}
const firstVal=(rows,k)=>{for(const r of rows) if(r[k]!=null) return r[k]; return null};
const lastVal=(rows,k)=>{for(let i=rows.length-1;i>=0;i--) if(rows[i][k]!=null) return rows[i][k]; return null};

function renderTiles(rows){
  const el=document.getElementById('tiles'); el.innerHTML='';
  for(const k of ['m','u','r']){
    const a=firstVal(rows,k), b=lastVal(rows,k), ch=(b/a-1)*100;
    const extra = k==='r' ? `${b-a>0?'+':''}${(b-a).toLocaleString('es-AR')} pb · ${pct(ch)}` : pct(ch);
    const c = k==='r' ? cls(-ch) : cls(ch);
    el.insertAdjacentHTML('beforeend',`<div class="tile"><div class="lab"><span class="sw" style="background:var(${SER[k].color})"></span>${SER[k].name}</div>
      <div class="val">${SER[k].fmt(b)}</div><div class="chg ${c}">${extra} <small>${RANGES[state.range].toLowerCase()}</small></div></div>`);
  }
}

function niceTicks(lo,hi,n){
  const span=hi-lo||Math.abs(hi)||1, step0=span/n, mag=Math.pow(10,Math.floor(Math.log10(step0)));
  const step=[1,2,2.5,5,10].map(s=>s*mag).find(s=>span/s<=n)||10*mag;
  const t=[]; for(let v=Math.ceil(lo/step)*step; v<=hi+1e-9; v+=step) t.push(+v.toFixed(10));
  return {t,step};
}

const charts=[];
function makeChart(host, cfg){
  // cfg: {series:[{k,vals:[...] aligned to rows}], rows, height, yfmt, label, tipFn}
  const box=document.createElement('div'); box.className='chart'; host.appendChild(box);
  const W=Math.max(300, box.clientWidth||host.clientWidth), H=cfg.height;
  const narrow=W<520;
  const M={t:cfg.label?22:10, r:narrow?10:16, b:26, l:narrow?52:68};
  const rows=cfg.rows, n=rows.length;
  let lo=Infinity,hi=-Infinity;
  cfg.series.forEach(s=>s.vals.forEach(v=>{if(v!=null){lo=Math.min(lo,v);hi=Math.max(hi,v)}}));
  const pad=(hi-lo)*0.08||Math.abs(hi)*0.02||1; lo-=pad; hi+=pad;
  const {t:yt}=niceTicks(lo,hi,H<260?4:(narrow?5:6));
  lo=Math.min(lo,yt[0]); hi=Math.max(hi,yt[yt.length-1]);
  const x0=rows[0].d.getTime(), x1=rows[n-1].d.getTime();
  const X=d=>M.l+((d.getTime()-x0)/(x1-x0||1))*(W-M.l-M.r);
  const Y=v=>M.t+(1-(v-lo)/(hi-lo))*(H-M.t-M.b);
  const ns='http://www.w3.org/2000/svg';
  let s=`<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${cfg.aria}">`;
  if(cfg.label) s+=`<text class="plab" x="${M.l}" y="13">${cfg.label}</text>`;
  yt.forEach(v=>{ const y=Y(v); s+=`<line x1="${M.l}" x2="${W-M.r}" y1="${y}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>
    <text x="${M.l-8}" y="${y+4}" text-anchor="end">${cfg.yfmt(v)}</text>`; });
  if(cfg.ref!=null){ const y=Y(cfg.ref); s+=`<line x1="${M.l}" x2="${W-M.r}" y1="${y}" y2="${y}" stroke="var(--muted)" stroke-dasharray="3 3" stroke-width="1"/>`; }
  // x ticks
  const span=(x1-x0)/864e5; let xt=[];
  if(span<=10){ xt=rows.map(r=>r.d); }
  else if(span<=40){ xt=rows.filter((r,i)=>i%Math.ceil(n/(narrow?4:7))===0).map(r=>r.d); }
  else { const seen=new Set(); rows.forEach(r=>{const k=r.d.getMonth(); if(!seen.has(k)){seen.add(k); xt.push(r.d)}});
         if(narrow && xt.length>5) xt=xt.filter((d,i)=>i%2===0); }
  { const minGap=narrow?34:40, kept=[]; xt.forEach(d=>{ if(kept.length && X(d)-X(kept[kept.length-1])<minGap) kept.pop(); kept.push(d); }); xt=kept; }
  xt.forEach(d=>{ const x=X(d); const lab= span>40? MES[d.getMonth()] : fmtD(d);
    s+=`<text x="${x}" y="${H-6}" text-anchor="middle">${lab}</text>`; });
  s+=`<line x1="${M.l}" x2="${W-M.r}" y1="${H-M.b}" y2="${H-M.b}" stroke="var(--line)"/>`;
  cfg.series.forEach(se=>{
    let d='', pen=false, lastPt=null;
    rows.forEach((r,i)=>{ const v=se.vals[i]; if(v==null) return; const px=X(r.d),py=Y(v); d+=(pen?'L':'M')+px.toFixed(1)+' '+py.toFixed(1); pen=true; lastPt=[px,py]; });
    if(cfg.area){ const f=rows.findIndex((r,i)=>se.vals[i]!=null);
      s+=`<path d="${d}L${lastPt[0]} ${H-M.b}L${X(rows[f].d)} ${H-M.b}Z" fill="var(${SER[se.k].color})" fill-opacity=".10" stroke="none"/>`; }
    s+=`<path d="${d}" fill="none" stroke="var(${SER[se.k].color})" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    if(lastPt) s+=`<circle cx="${lastPt[0]}" cy="${lastPt[1]}" r="4" fill="var(${SER[se.k].color})" stroke="var(--panel)" stroke-width="2"/>`;
  });
  s+=`<g class="hover" style="display:none"><line class="hx" y1="${M.t}" y2="${H-M.b}" stroke="var(--muted)" stroke-width="1"/>`+
     cfg.series.map(se=>`<circle class="hd" data-k="${se.k}" r="4.5" fill="var(${SER[se.k].color})" stroke="var(--panel)" stroke-width="2"/>`).join('')+`</g>`;
  s+=`<rect class="hit" x="${M.l}" y="0" width="${W-M.l-M.r}" height="${H}" fill="transparent"/></svg>`;
  box.innerHTML=s;
  const svg=box.querySelector('svg'), g=svg.querySelector('.hover'), hx=svg.querySelector('.hx');
  const obj={box,svg,X,Y,rows,cfg,W,H,M,show(i){
    if(i==null){g.style.display='none';return}
    const r=rows[i], x=X(r.d); g.style.display=''; hx.setAttribute('x1',x); hx.setAttribute('x2',x);
    svg.querySelectorAll('.hd').forEach(c=>{const se=cfg.series.find(s=>s.k===c.dataset.k), v=se.vals[i];
      if(v==null){c.style.display='none'} else {c.style.display='';c.setAttribute('cx',x);c.setAttribute('cy',Y(v))}});
  }};
  charts.push(obj);
  return obj;
}

let tip;
function attachHover(rows){
  const host=document.getElementById('charts');
  if(!tip){tip=document.createElement('div');tip.className='tip';tip.hidden=true;host.style.position='relative';host.appendChild(tip)}
  const idxAt=(c,clientX)=>{const b=c.svg.getBoundingClientRect(); const x=(clientX-b.left)*(c.W/b.width);
    let best=0,bd=Infinity; rows.forEach((r,i)=>{const dd=Math.abs(c.X(r.d)-x); if(dd<bd){bd=dd;best=i}}); return best;};
  charts.forEach(c=>{
    const hit=c.svg.querySelector('.hit');
    const move=e=>{const pt=e.touches?e.touches[0]:e; const i=idxAt(c,pt.clientX); charts.forEach(o=>o.show(i));
      tip.innerHTML=tipHTML(rows,i); tip.hidden=false;
      const hb=host.getBoundingClientRect(), cb=c.svg.getBoundingClientRect();
      const px=cb.left-hb.left + c.X(rows[i].d)*(cb.width/c.W);
      const tw=tip.offsetWidth; let left=px+14; if(left+tw>hb.width) left=px-tw-14; if(left<0) left=0;
      tip.style.left=left+'px'; tip.style.top=(cb.top-hb.top+8)+'px';};
    hit.addEventListener('mousemove',move); hit.addEventListener('touchmove',move,{passive:true}); hit.addEventListener('touchstart',move,{passive:true});
    hit.addEventListener('mouseleave',()=>{charts.forEach(o=>o.show(null)); tip.hidden=true});
  });
}
function tipHTML(rows,i){
  const r=rows[i]; let h=`<div class="d">${fmtDL(r.d)}</div>`;
  const keys = state.view==='all'?['m','u','r']: state.view==='merv'?['m','u']:['r'];
  keys.forEach(k=>{ const b=firstVal(rows,k), v=r[k];
    const chg = v==null?'':(k==='r'? `${v-b>0?'+':''}${(v-b).toLocaleString('es-AR')} pb` : pct((v/b-1)*100));
    const c = v==null?'flat':(k==='r'?cls(-(v-b)):cls(v/b-1));
    h+=`<div class="r"><span class="sw" style="background:var(${SER[k].color})"></span><span><span class="n">${SER[k].short}</span> ${v==null?'s/d':SER[k].fmt(v)}</span><span class="p ${c}">${chg}</span></div>`; });
  return h+`<div class="note" style="margin-top:4px">Variación vs. ${fmtD(rows[0].d)}</div>`;
}

function renderLegend(keys){
  document.getElementById('legend').innerHTML = keys.map(k=>`<span><span class="sw" style="background:var(${SER[k].color})"></span>${SER[k].name}</span>`).join('');
}

function renderTable(rows){
  const t=document.getElementById('tbl');
  let h='<thead><tr><th>Fecha</th><th>Merval $</th><th>Var. %</th><th>Merval US$</th><th>Var. %</th><th>Riesgo país</th><th>Var. pb</th></tr></thead><tbody>';
  const prev={};
  const out=[];
  rows.forEach(r=>{
    const cell=(k)=>{ if(r[k]==null) return '<td>s/d</td><td></td>';
      const p=prev[k]; let c='';
      if(p!=null) c = k==='r'? `<td class="${cls(-(r[k]-p))}">${r[k]-p>0?'+':''}${(r[k]-p).toLocaleString('es-AR')}</td>` : `<td class="${cls(r[k]/p-1)}">${pct((r[k]/p-1)*100)}</td>`;
      else c='<td></td>';
      prev[k]=r[k]; return `<td>${SER[k].fmt(r[k])}</td>`+c; };
    out.push(`<tr><td>${fmtD(r.d)}${r.d.getFullYear()!==2026?'':''}</td>${cell('m')}${cell('u')}${cell('r')}</tr>`);
  });
  t.innerHTML=h+out.reverse().join('')+'</tbody>';
}

function render(){
  document.querySelectorAll('#viewSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===state.view));
  document.querySelectorAll('#rangeSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.r===state.range));
  try{localStorage.setItem('mervrp',JSON.stringify(state))}catch(e){}
  const rows=windowRows(state.range);
  renderTable(rows);
  const host=document.getElementById('charts'); host.innerHTML=''; charts.length=0; tip=null;
  const narrow=host.clientWidth<520;
  const title=document.getElementById('chartTitle'), note=document.getElementById('chartNote');
  const rng=RANGES[state.range];
  if(state.view==='all'){
    title.textContent=`Las tres series en base 100 · ${rng}`;
    renderLegend(['m','u','r']);
    const series=['m','u','r'].map(k=>{const b=firstVal(rows,k); return {k, vals:rows.map(r=>r[k]==null?null:r[k]/b*100)}});
    makeChart(host,{rows,series,height:narrow?300:380,ref:100,yfmt:v=>v.toLocaleString('es-AR',{maximumFractionDigits:1}),aria:'Merval en pesos, Merval en dólares y riesgo país en base 100'});
    note.textContent=`Cada serie vale 100 el ${fmtD(rows[0].d)}. En riesgo país, una suba de la línea significa más riesgo (peor); en el Merval, una suba es ganancia.`;
  } else if(state.view==='merv'){
    title.textContent=`Merval en pesos y en dólares · ${rng}`;
    renderLegend(['m','u']);
    const h=narrow?200:240;
    makeChart(host,{rows,series:[{k:'m',vals:rows.map(r=>r.m)}],height:h,label:'En pesos (puntos)',yfmt:v=>(v/1e6).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2})+' M',aria:'Merval en pesos'});
    makeChart(host,{rows,series:[{k:'u',vals:rows.map(r=>r.u)}],height:h,label:'En dólares (CCL implícito)',yfmt:v=>v.toLocaleString('es-AR',{maximumFractionDigits:0}),aria:'Merval en dólares'});
    note.textContent='Cada panel tiene su propia escala. La diferencia entre ambas curvas es el movimiento del dólar CCL implícito.';
  } else {
    title.textContent=`Riesgo país (EMBI, puntos básicos) · ${rng}`;
    renderLegend(['r']);
    makeChart(host,{rows,series:[{k:'r',vals:rows.map(r=>r.r)}],height:narrow?300:380,area:true,yfmt:v=>v.toLocaleString('es-AR',{maximumFractionDigits:0}),aria:'Riesgo país'});
    note.textContent='Más alto significa mayor riesgo percibido: la sobretasa que pagan los bonos argentinos en dólares sobre los del Tesoro de EE.UU.';
  }
  attachHover(rows);
}
document.getElementById('viewSeg').addEventListener('click',e=>{const b=e.target.closest('button'); if(b){state.view=b.dataset.v; render()}});
document.getElementById('rangeSeg').addEventListener('click',e=>{const b=e.target.closest('button'); if(b){state.range=b.dataset.r; render()}});
let rw=0; new ResizeObserver(en=>{const w=Math.round(en[0].contentRect.width); if(w!==rw){rw=w; render()}}).observe(document.getElementById('charts').parentElement);
render();
</script>

</body></html>
